name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names. github.repository can include uppercase letters.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Tests & Build
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: test-secret-key
        # Failing tests fail the build (they used to be ignored with "|| true").
        run: |
          pytest --cov=app --cov-report=xml
      
      - name: Build Docker image
        working-directory: ./backend
        run: |
          IMAGE_REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_REPO-backend:latest .

  # Frontend Tests & Build
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm test
      
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # Build & Push Docker Images
  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push backend
        working-directory: ./backend
        run: |
          IMAGE_REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ${{ env.REGISTRY }}/$IMAGE_REPO-backend:${{ github.sha }} .
          docker build -t ${{ env.REGISTRY }}/$IMAGE_REPO-backend:latest .
          docker push ${{ env.REGISTRY }}/$IMAGE_REPO-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/$IMAGE_REPO-backend:latest
      
      - name: Build and push frontend
        run: |
          IMAGE_REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -f Dockerfile.frontend -t ${{ env.REGISTRY }}/$IMAGE_REPO-frontend:${{ github.sha }} .
          docker build -f Dockerfile.frontend -t ${{ env.REGISTRY }}/$IMAGE_REPO-frontend:latest .
          docker push ${{ env.REGISTRY }}/$IMAGE_REPO-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/$IMAGE_REPO-frontend:latest

  # Deploy to Kubernetes
  # Runs only when a KUBECONFIG secret is configured. Secrets can't be used in a job-level "if",
  # so the check is exposed as an environment variable and tested on each step.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}

    steps:
      - name: Skip when no cluster is configured
        if: env.HAS_KUBECONFIG != 'true'
        run: echo "No KUBECONFIG secret set; Kubernetes deploy skipped (the app deploys through Vercel and Railway)."

      - uses: actions/checkout@v4
        if: env.HAS_KUBECONFIG == 'true'

      - name: Setup kubectl
        if: env.HAS_KUBECONFIG == 'true'
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        if: env.HAS_KUBECONFIG == 'true'
        uses: azure/setup-helm@v4

      - name: Configure Kubernetes
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig
      
      - name: Deploy to Kubernetes
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          export KUBECONFIG=./kubeconfig
          kubectl set image deployment/insightsheet-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }} \
            -n insightsheet
          kubectl set image deployment/insightsheet-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} \
            -n insightsheet
          kubectl rollout status deployment/insightsheet-backend -n insightsheet
          kubectl rollout status deployment/insightsheet-frontend -n insightsheet
