name: Records backup

# Weekly encrypted backup of account, billing, sign-in and consent records (docs/DATA_PROTECTION.md).
# Needs two repository secrets: BACKUP_DATABASE_URL and BACKUP_PASSPHRASE. Without them it does nothing.
on:
  schedule:
    - cron: "17 2 * * 1"   # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$PASS" ]; then
            echo "BACKUP_DATABASE_URL or BACKUP_PASSPHRASE is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Back up records
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          pip install --quiet "sqlalchemy==2.0.36" "psycopg2-binary" "cryptography==44.0.0"
          python backend/tools/backup_records.py backup --out "meldra-records-$(date -u +%Y-%m-%d).bak"

      # Encrypted file only; kept 90 days, so a deleted account leaves the backups within 90 days.
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: meldra-records-${{ github.run_id }}
          path: meldra-records-*.bak
          retention-days: 90
          if-no-files-found: error
