# Small Redis for shared rate limits and job counters across backend servers.
# Holds only counters that expire within minutes; no customer data. On AWS, ElastiCache can replace it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightsheet-redis
  namespace: insightsheet
  labels:
    app: insightsheet-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insightsheet-redis
  template:
    metadata:
      labels:
        app: insightsheet-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        readinessProbe:
          tcpSocket:
            port: 6379
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: insightsheet-redis
  namespace: insightsheet
spec:
  selector:
    app: insightsheet-redis
  ports:
  - port: 6379
    targetPort: 6379
